<div class="modal-header">
  <h4 class="modal-title">Welcome to Mockuuu!</h4>
</div>
<div class="modal-body">
  <p>
    Thank you for installing Mockuuu. If you have any questions, please refer to
    the
    <a href="https://mockoon.com/docs/latest/about/" target="_blank"
      >documentation</a
    >
    or <a href="https://mockoon.com/contact/" target="_blank">contact us</a>.
  </p>
</div>
<div class="modal-footer">
  <button
    type="button"
    class="btn btn-primary modal-close"
    (click)="close(true)"
  >
    Take the tour
  </button>
  <button type="button" class="btn btn-secondary" (click)="close(false)">
    No thanks
  </button>
</div>
