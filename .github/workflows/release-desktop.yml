name: Release desktop

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  generate-sbom:
    name: Generate SPDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set app version from tag
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const path = './packages/app/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Set packages/app/package.json version to $VERSION (from tag $GITHUB_REF_NAME)"
      - name: Extract app version
        id: app-version
        run: |
          APP_VERSION=$(node -p "require('./packages/app/package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT
      - name: Generate SPDX SBOM file
        run: |
          mkdir -p sbom-files
          cd packages/app && npm sbom --sbom-type application --sbom-format spdx --omit dev > ../../sbom-files/mockoon-app-v${{steps.app-version.outputs.APP_VERSION}}-sbom.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-sbom-file-v${{steps.app-version.outputs.APP_VERSION}}
          path: sbom-files/

  build-macos:
    name: Build macOS binaries
    runs-on: macos-latest
    environment: production
    timeout-minutes: 60

    # Unsigned build: this fork has no Apple Developer ID / notarization credentials
    # (those belong to the upstream Mockoon team), so signing/notarization is skipped.
    # Users installing the resulting dmg will see a Gatekeeper warning on first launch.
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      USE_HARD_LINKS: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm i dmg-license
      - name: Set app version from tag
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const path = './packages/app/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Set packages/app/package.json version to $VERSION (from tag $GITHUB_REF_NAME)"
      - name: Build and package application
        run: |
          npm run build:libs
          npm run build:desktop:prod
          npm run package:desktop:mac:unsigned
      - name: Get dmg binaries shasum
        run: |
          shasum -a 256 ./packages/app/packages/mockoon.setup.*.arm64.dmg
          shasum -a 256 ./packages/app/packages/mockoon.setup.*.x64.dmg
      - name: Upload macOS dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dmg
          path: ./packages/app/packages/mockoon.setup*.dmg

  build-linux:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      USE_HARD_LINKS: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic
      - uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1.0.0
        with:
          version: latest/stable
      - name: Install dependencies
        run: npm ci
      - name: Set app version from tag
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const path = './packages/app/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Set packages/app/package.json version to $VERSION (from tag $GITHUB_REF_NAME)"
      - name: Build and package application
        run: |
          npm run build:libs
          npm run build:desktop:prod
          npm run package:desktop:linux
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appimage
          path: ./packages/app/packages/mockoon-*.AppImage
      - name: Upload Linux deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb
          path: ./packages/app/packages/mockoon-*.deb
      - name: Upload Linux rpm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm
          path: ./packages/app/packages/mockoon-*.rpm
      - name: Upload Linux snap
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snap
          path: ./packages/app/packages/mockoon-*.snap

  build-windows:
    name: Build Windows binaries
    runs-on: windows-latest
    environment: production
    timeout-minutes: 60

    # Unsigned build: this fork has no code-signing certificate (the Azure Trusted
    # Signing account belongs to the upstream Mockoon team). Users installing the
    # resulting exe will see a SmartScreen warning until they choose "Run anyway".
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set app version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const path = './packages/app/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Set packages/app/package.json version to $VERSION (from tag $GITHUB_REF_NAME)"
      - name: Build and package application
        run: |
          npm run build:libs
          npm run build:desktop:prod
          npm run package:desktop:win:unsigned
        shell: pwsh
      - name: Upload Windows setup exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exe
          path: ./packages/app/packages/mockoon.setup.*.exe
      - name: Upload Windows portable exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exe-portable
          path: ./packages/app/packages/mockoon.portable.*.exe

  # APPX build requires no code signing env vars to work, thus the separated job
  build-windows-appx:
    name: Build Windows Appx binary
    runs-on: windows-latest
    environment: production
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set app version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const path = './packages/app/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Set packages/app/package.json version to $VERSION (from tag $GITHUB_REF_NAME)"
      - name: Build and package application
        run: |
          npm run build:libs
          npm run build:desktop:prod
          npm run package:desktop:win:appx
        shell: pwsh
      - name: Upload Windows appx
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appx
          path: ./packages/app/packages/mockoon.*.appx

  publish-release:
    name: Attach binaries to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - generate-sbom
      - build-macos
      - build-linux
      - build-windows
      - build-windows-appx
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Create/update release with binaries
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Mockuuu ${{ github.ref_name }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
